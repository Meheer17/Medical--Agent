name: ClinIQ Web App E2E & Performance Test Suite

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  selenium-and-api-testing:
    name: Selenium E2E, API Integration & Performance Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js for Next.js Build
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python & Selenium Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager pytest

      - name: Build Next.js Web App
        run: |
          cd website
          npm ci || npm install
          npm run build

      - name: Execute 600 Selenium E2E & API Test Cases
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://135.235.136.30:9000"
        run: |
          python tests/test_runner.py
